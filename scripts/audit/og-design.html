<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Noto Sans Arabic", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif; }
  .og {
    width: 1200px; height: 630px;
    background: linear-gradient(135deg, #09090b 0%, #0a0f0d 55%, #052e22 100%);
    display: flex; flex-direction: row-reverse; align-items: center;
    padding: 72px 84px; position: relative;
  }
  .glow {
    position: absolute; left: -180px; top: -180px; width: 560px; height: 560px;
    background: radial-gradient(circle, rgba(16,185,129,0.22) 0%, rgba(16,185,129,0) 70%);
    border-radius: 50%;
  }
  .grid-lines {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .content { position: relative; z-index: 2; flex: 1; }
  .brand-row { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; flex-direction: row-reverse; }
  .logo-box {
    width: 84px; height: 84px; border-radius: 20px;
    background: #052e22; border: 2px solid #047857;
    display: flex; align-items: center; justify-content: center;
    font-size: 46px; color: #34d399; font-weight: 900;
  }
  .brand-name { font-size: 34px; font-weight: 800; color: #fafafa; letter-spacing: -0.5px; }
  .brand-sub { font-size: 19px; color: #a1a1aa; margin-top: 4px; font-weight: 400; }
  h1 {
    font-size: 64px; font-weight: 800; color: #fafafa; line-height: 1.28;
    margin-bottom: 22px; letter-spacing: -1px;
  }
  h1 .accent { color: #34d399; }
  .badges { display: flex; gap: 14px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px; border-radius: 999px; font-size: 20px; font-weight: 700;
  }
  .b1 { background: rgba(6,78,59,0.55); border: 1.5px solid #047857; color: #6ee7b7; }
  .b2 { background: rgba(8,51,68,0.55); border: 1.5px solid #155e75; color: #67e8f9; }
  .b3 { background: rgba(69,26,3,0.45); border: 1.5px solid #92400e; color: #fcd34d; }
  .pay { margin-top: 34px; font-size: 20px; color: #71717a; font-weight: 500; }
  .pay b { color: #a1a1aa; font-weight: 700; }
</style>
</head>
<body>
<div class="og">
  <div class="glow"></div>
  <div class="grid-lines"></div>
  <div class="content">
    <div class="brand-row">
      <div class="logo-box">⚡</div>
      <div>
        <div class="brand-name">متجر MEC الرقمي</div>
        <div class="brand-sub">MEC Digital Store</div>
      </div>
    </div>
    <h1>اشتراكات AI وبث MENA<br><span class="accent">بتسليم فوري</span> بأفضل الأسعار</h1>
    <div class="badges">
      <span class="badge b1">⚡ تسليم ≤ 3 دقائق</span>
      <span class="badge b2">🔒 سعر مقفل عند الطلب</span>
      <span class="badge b3">💸 كاش باك 1%</span>
    </div>
    <div class="pay">💳 الدفع: <b>USDT TRC-20 · Binance Pay</b> — شراء مباشر برقم الجوال</div>
  </div>
</div>
</body>
</html>
