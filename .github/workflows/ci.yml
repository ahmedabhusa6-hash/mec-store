name: CI — فحوصات الجودة

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r price-monitor/requirements.txt
      - run: python -m py_compile price-monitor/monitor.py price-monitor/providers/base.py price-monitor/providers/reloadly.py price-monitor/providers/mock.py price-monitor/providers/botshops.py
      - run: python price-monitor/tests/test_providers.py
        env:
          SUPABASE_URL: "https://invalid.example.supabase.co"
          SUPABASE_KEY: "test-key"
